<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./images/title_logo.jpg" />
    <title>tripAdvisor</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body>
    <!--  Navbar mobile1 -->
    <div class="Navbar1">
        <img src="./images/burger-bar.png" alt="" />
        <div class="Navbar1_title">
            <img src="./images/logo.svg" alt="">
            <h1>Tripadvisor</h1>
        </div>
        <img src="./images/user.png" alt="">
    </div>
    <!-- NavBar mobile2 -->
    <div class="Navbar2 bg-slate-50bjg;">
      <img src="./images/burger-bar.png" alt="" />
      <img src="./images/logo.svg" alt="" />
      <div class="Navbar2_search">
        <img src="./images/search.png" alt="" />
        <input type="text" placeholder="Search" />
      </div>
      <img src="./images/user.png" alt="" />
    </div>
    <!-- Navbar desktop -->
    <nav class="Navbar_desktop">
      <img src="./images/wordmark.svg" alt="">
      <div class="desktop_Navbar-2">
        <h1>Discover</h1>
        <h1>Trips</h1>
        <h1>Review</h1>
        <h1>More</h1>
      </div>
      <div class="desktop_Navbar-3">
        <img src="./images/internet.png" alt="">
        <p>| INR</p>
        <button>sign in</button>
      </div>
    </nav>
    <script src="script.js"></script>

  </body>
</html>
